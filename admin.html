<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수업 활동 통합 관리자 페이지</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', sans-serif, Arial; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; color: #1a252f; }
    .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { padding: 12px 24px; font-size: 15px; border: none; background-color: #e2e8f0; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .tab-btn.active { background-color: #3b82f6; color: white; }
    .refresh-btn { padding: 10px 18px; background-color: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 12px; text-align: left; font-size: 14px; white-space: nowrap; }
    th { background-color: #f8fafc; color: #475569; font-weight: 600; }
    tr:hover { background-color: #f1f5f9; }
    .loading { text-align: center; padding: 40px; font-weight: bold; color: #64748b; }
    .img-preview { max-width: 80px; max-height: 80px; border-radius: 4px; object-fit: cover; vertical-align: middle; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📊 수업 활동 통합 관리자</h1>
    <button class="refresh-btn" onclick="loadData()">🔄 데이터 새로고침</button>
  </div>

  <div class="tab-container">
    <button class="tab-btn active" id="btn-app1" onclick="switchTab('app1')">📝 웹앱 1 (퀴즈/점수)</button>
    <button class="tab-btn" id="btn-app2" onclick="switchTab('app2')">🎨 웹앱 2 (작품/투표)</button>
  </div>

  <div class="card">
    <div id="loading" class="loading">데이터를 불러오는 중입니다...</div>
    <div id="table-container"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwbpopRqKpJYo1vQgn4_zz21fXI--CrE3RzywEJ_HhdOiILXV7lsJMk_OdZVjEdZwy8/exec";

    let globalData = { app1: [], app2: [] };
    let currentTab = 'app1';

    async function loadData() {
      const container = document.getElementById('table-container');
      const loading = document.getElementById('loading');
      
      loading.style.display = 'block';
      container.innerHTML = '';

      try {
        const response = await fetch(GAS_URL);
        globalData = await response.json();
        loading.style.display = 'none';
        renderTable(currentTab);
      } catch (error) {
        loading.innerText = '❌ 데이터를 불러오는 데 실패했습니다. 앱스크립트 배포 권한(모든 사용자) 및 시트 ID를 확인해 주세요.';
        console.error(error);
      }
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.getElementById('btn-app1').classList.toggle('active', tabName === 'app1');
      document.getElementById('btn-app2').classList.toggle('active', tabName === 'app2');
      renderTable(tabName);
    }

    function renderTable(tabName) {
      const data = globalData[tabName];
      const container = document.getElementById('table-container');

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding:20px;">제출된 데이터가 없습니다.</p>';
        return;
      }

      const headers = Object.keys(data[0]);
      let html = '<table><thead><tr>';
      headers.forEach(h => html += `<th>${h}</th>`);
      html += '</tr></thead><tbody>';

      data.forEach(row => {
        html += '<tr>';
        headers.forEach(h => {
          let cellValue = row[h] !== undefined ? row[h] : '';
          
          // '이미지' 열에서 URL 형태일 경우 미니 이미지 및 클릭 링크로 렌더링
          if (h === '이미지' && typeof cellValue === 'string' && cellValue.startsWith('http')) {
            cellValue = `<a href="${cellValue}" target="_blank"><img src="${cellValue}" class="img-preview" alt="제출이미지" onerror="this.outerHTML='[이미지 링크]'"/></a>`;
          }
          
          html += `<td>${cellValue}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // 페이지 진입 시 자동 실행
    loadData();
  </script>
</body>
</html>
